<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Universe - IAM Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes stars {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2000px); }
        }

        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(to bottom, #0a1f1f 0%, #0d2d2d 50%, #1a3a3a 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 60px 70px, white, transparent),
                radial-gradient(1px 1px at 50px 50px, white, transparent),
                radial-gradient(1px 1px at 130px 80px, white, transparent),
                radial-gradient(2px 2px at 90px 10px, white, transparent);
            background-size: 200px 200px;
            animation: stars 100s linear infinite;
            opacity: 0.4;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 217, 163, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(0, 217, 163, 0.2);
        }

        header {
            background: linear-gradient(135deg, #00D9A3 0%, #00BF8F 50%, #00A67E 100%);
            color: white;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 217, 163, 0.3);
        }

        header h1 {
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1::before {
            content: '🌌';
            font-size: 2.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .main-content {
            padding: 40px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 1px solid rgba(0, 217, 163, 0.1);
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 217, 163, 0.2);
        }

        .section h2::before {
            content: '✨';
            font-size: 1.5rem;
        }

        .orchestrators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .orchestrator-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border: 2px solid #27ae60;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .orchestrator-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }

        .orchestrator-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .orchestrator-card .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #27ae60;
            animation: glow 2s infinite;
        }

        .orchestrator-card .detail {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin: 8px 0;
        }

        .orchestrator-card .detail strong {
            color: #34495e;
        }

        .jobs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .jobs-table th {
            background: linear-gradient(135deg, #00D9A3 0%, #00BF8F 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .jobs-table td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
        }

        .jobs-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-running { background: #cce5ff; color: #004085; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00D9A3 0%, #00BF8F 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 217, 163, 0.4);
        }

        .job-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .job-form input,
        .job-form select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .job-form input:focus,
        .job-form select:focus {
            outline: none;
            border-color: #00D9A3;
            box-shadow: 0 0 0 3px rgba(0, 217, 163, 0.1);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #95a5a6;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00D9A3;
        }

        .spinner-inline {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 217, 163, 0.3);
            border-radius: 50%;
            border-top-color: #00D9A3;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Identity Universe</h1>
            <div class="user-info">
                <span class="user-name" id="userDisplay"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Orchestrators Section -->
            <div class="section">
                <h2>Orchestrators</h2>
                <div id="orchestratorsContainer">
                    <div class="loading">
                        <div class="spinner-inline"></div>
                        Loading orchestrators...
                    </div>
                </div>
            </div>

            <!-- Create Job Section -->
            <div class="section">
                <h2>Create New Job</h2>
                <form id="jobForm" class="job-form">
                    <input type="text" id="customerName" placeholder="Customer Name" required>
                    <select id="jobType" required>
                        <option value="">Select Job Type</option>
                        <option value="usersync">User Sync</option>
                        <option value="groupsync">Group Sync</option>
                        <option value="audit">Audit</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Create Job</button>
                </form>
            </div>

            <!-- Jobs Section -->
            <div class="section">
                <h2>Recent Jobs</h2>
                <div id="jobsContainer">
                    <div class="loading">
                        <div class="spinner-inline"></div>
                        Loading jobs...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');

        if (!token || !username) {
            window.location.href = '/login.html';
        }

        document.getElementById('userDisplay').textContent = username;

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = '/login.html';
        }

        async function fetchWithAuth(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    ...options.headers,
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401) {
                logout();
                return null;
            }

            return response;
        }

        async function loadOrchestrators() {
            try {
                const response = await fetchWithAuth('/api/orchestrators');
                if (!response) return;

                const orchestrators = await response.json();
                const container = document.getElementById('orchestratorsContainer');

                if (orchestrators.length === 0) {
                    container.innerHTML = '<div class="no-data">No orchestrators found</div>';
                    return;
                }

                container.innerHTML = `
                    <div class="orchestrators-grid">
                        ${orchestrators.map(orch => `
                            <div class="orchestrator-card">
                                <h3>
                                    <span class="status"></span>
                                    ${orch.name}
                                </h3>
                                <div class="detail"><strong>Host:</strong> ${orch.hostName}</div>
                                <div class="detail"><strong>Port:</strong> ${orch.port}</div>
                                <div class="detail"><strong>Last Seen:</strong> ${new Date(orch.lastHeartbeat).toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading orchestrators:', error);
                document.getElementById('orchestratorsContainer').innerHTML = 
                    '<div class="no-data">Error loading orchestrators</div>';
            }
        }

        async function loadJobs() {
            try {
                const response = await fetchWithAuth('/api/jobs');
                if (!response) return;

                const jobs = await response.json();
                const container = document.getElementById('jobsContainer');

                if (jobs.length === 0) {
                    container.innerHTML = '<div class="no-data">No jobs found</div>';
                    return;
                }

                container.innerHTML = `
                    <table class="jobs-table">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Job Type</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Orchestrator</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${jobs.slice(0, 20).map(job => `
                                <tr>
                                    <td>${job.customerName}</td>
                                    <td>${job.jobType}</td>
                                    <td><span class="status-badge status-${job.status.toLowerCase()}">${job.status}</span></td>
                                    <td>${new Date(job.createdAt).toLocaleString()}</td>
                                    <td>${job.orchestratorId || 'Pending'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsContainer').innerHTML = 
                    '<div class="no-data">Error loading jobs</div>';
            }
        }

        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const customerName = document.getElementById('customerName').value;
            const jobType = document.getElementById('jobType').value;

            try {
                const response = await fetchWithAuth('/api/jobs', {
                    method: 'POST',
                    body: JSON.stringify({ customerName, jobType })
                });

                if (response && response.ok) {
                    document.getElementById('customerName').value = '';
                    document.getElementById('jobType').value = '';
                    await loadJobs();
                    alert('Job created successfully!');
                } else {
                    alert('Failed to create job');
                }
            } catch (error) {
                console.error('Error creating job:', error);
                alert('Error creating job');
            }
        });

        // Initial load
        loadOrchestrators();
        loadJobs();

        // Refresh every 5 seconds
        setInterval(() => {
            loadOrchestrators();
            loadJobs();
        }, 5000);
    </script>
</body>
</html>
