<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <meta name="color-scheme" content="light dark" />
    <title>IAM Dashboard</title>
    <base href="/" />
    <!-- Favicon: SVG for modern browsers, ICO fallback for legacy -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <span>🔐 Loading IAM Dashboard...</span>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Dark mode management
        window.darkMode = {
            get: function() {
                const stored = localStorage.getItem('darkMode');
                if (stored !== null) return stored === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            },
            set: function(isDark) {
                localStorage.setItem('darkMode', isDark);
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.querySelector('meta[name="theme-color"]').content = isDark ? '#1f2937' : '#10b981';
            },
            toggle: function() {
                const newValue = !this.get();
                this.set(newValue);
                return newValue;
            },
            init: function() {
                this.set(this.get());
            }
        };
        // Initialize on load
        window.darkMode.init();

        window.showToast = function(message, type, title) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
            
            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(400px)';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        };
    </script>
</body>
</html>
