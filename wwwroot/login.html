<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Universe - IAM Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes stars {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2000px); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 217, 163, 0.8), 0 0 40px rgba(0, 217, 163, 0.5); }
            50% { text-shadow: 0 0 30px rgba(0, 217, 163, 1), 0 0 60px rgba(0, 217, 163, 0.7); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(to bottom, #0a1f1f 0%, #0d2d2d 50%, #1a3a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 60px 70px, white, transparent),
                radial-gradient(1px 1px at 50px 50px, white, transparent),
                radial-gradient(1px 1px at 130px 80px, white, transparent),
                radial-gradient(2px 2px at 90px 10px, white, transparent);
            background-size: 200px 200px;
            animation: stars 100s linear infinite;
            opacity: 0.5;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 217, 163, 0.3), 0 0 100px rgba(0, 191, 143, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            animation: float 6s ease-in-out infinite;
            border: 1px solid rgba(0, 217, 163, 0.2);
            position: relative;
            z-index: 10;
        }

        .login-header {
            background: linear-gradient(135deg, #00D9A3 0%, #00BF8F 50%, #00A67E 100%);
            color: white;
            padding: 50px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-header::before {
            content: '✨';
            position: absolute;
            font-size: 60px;
            top: 10px;
            left: 20px;
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        .login-header::after {
            content: '🌟';
            position: absolute;
            font-size: 40px;
            bottom: 20px;
            right: 30px;
            opacity: 0.3;
            animation: float 5s ease-in-out infinite reverse;
        }

        .login-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            animation: glow 3s ease-in-out infinite;
        }

        .login-header .subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .login-form {
            padding: 45px 40px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00D9A3;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 217, 163, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00D9A3 0%, #00BF8F 50%, #00A67E 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .hidden-fill-button {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            opacity: 0;
            cursor: pointer;
            background: transparent;
            border: none;
            z-index: 5;
        }

        .hidden-fill-button:hover {
            opacity: 0.1;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading .login-button span {
            display: none;
        }

        .loading .spinner {
            display: inline-block;
        }

        .spinner {
            display: none;
        }

        .disclaimer {
            text-align: center;
            font-size: 0.8rem;
            color: #95a5a6;
            margin-top: 25px;
            padding: 0 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Identity Universe</h1>
            <p class="subtitle">Welcome to IAM Portal</p>
        </div>
        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-button" id="loginButton">
                    <span>Access Portal</span>
                    <div class="spinner"></div>
                </button>
            </form>
            
            <div class="disclaimer">
                By accessing this site, you agree to participate in testing and consent to the collection of behavioral analytics related to how the site is used.
            </div>
            
            <button class="hidden-fill-button" onclick="fillCredentials()" title="Fill default credentials"></button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function fillCredentials() {
            usernameInput.value = 'admin';
            passwordInput.value = 'IAM#2026!SecureP@ssw0rd';
            loginButton.focus();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            loginButton.disabled = true;
            loginForm.classList.add('loading');
            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    window.location.href = '/index.html';
                } else {
                    const error = await response.json();
                    showError(error.message || 'Invalid credentials. Please try again.');
                    loginButton.disabled = false;
                    loginForm.classList.remove('loading');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection and try again.');
                loginButton.disabled = false;
                loginForm.classList.remove('loading');
            }
        });

        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
